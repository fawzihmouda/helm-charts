---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: container - fields - envFrom
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: default should pass
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: explicit envFrom should pass
    set:
      deployment:
        envFrom:
          - secretRef:
              name: myCustomSecret
            prefix: test
          - configMapRef:
              name: myCustomConfig
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: myCustomSecret
            prefix: test
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            configMapRef:
              name: myCustomConfig

  - it: envFrom from defaultContainerOptions should pass
    set:
      deployment:
        defaultContainerOptions:
          envFrom:
            - secretRef:
                name: myCustomSecret
              prefix: test
            - configMapRef:
                name: myCustomConfig
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: myCustomSecret
            prefix: test
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            configMapRef:
              name: myCustomConfig

  - it: envFrom from defaultContainerOptions with container override should pass
    set:
      deployment:
        defaultContainerOptions:
          envFrom:
            - secretRef:
                name: myCustomSecret
              prefix: test
            - configMapRef:
                name: myCustomConfig
        envFrom:
          - secretRef:
              name: myCustomSecretOverride
            prefix: test
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: myCustomSecretOverride
            prefix: test
      - notExists:
          path: spec.template.spec.containers[0].envFrom[1]

  - it: envFrom configmap identifier reference should pass
    set:
      configMaps:
        config:
          data:
            test: test
      deployment:
        envFrom:
          - configMap: config
            prefix: test
          - configMapRef:
              identifier: config
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            configMapRef:
              name: release-name
            prefix: test
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            configMapRef:
              name: release-name

  - it: envFrom Secret identifier reference should pass
    set:
      secrets:
        secret:
          stringData:
            test: test
      deployment:
        envFrom:
          - secret: secret
            prefix: test
          - secretRef:
              identifier: secret
            prefix: test
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: release-name
            prefix: test
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            secretRef:
              name: release-name
            prefix: test

  - it: envFrom ExternalSecret identifier reference should pass
    set:
      defaultExternalSecretStoreRef:
        name: provider-store
      externalSecrets:
        external:
          target:
            name: eso-managed-secret
          data:
            - secretKey: password
              remoteRef:
                key: credentials
      deployment:
        envFrom:
          - externalSecretRef:
              identifier: external
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: eso-managed-secret

  - it: envFrom ExternalSecret identifier uses the generated target name by default
    set:
      defaultExternalSecretStoreRef:
        name: provider-store
      externalSecrets:
        external:
          data:
            - secretKey: password
              remoteRef:
                key: credentials
      deployment:
        envFrom:
          - externalSecretRef:
              identifier: external
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: release-name

  - it: envFrom with templated name reference should pass
    set:
      deployment:
        envFrom:
          - configMap: '{{ .Release.Name }}-config'
          - configMapRef:
              name: '{{ .Release.Name }}-config2'
          - secret: '{{ .Release.Name }}-secret'
          - secretRef:
              name: '{{ .Release.Name }}-secret2'
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            configMapRef:
              name: RELEASE-NAME-config
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            configMapRef:
              name: RELEASE-NAME-config2
      - equal:
          path: spec.template.spec.containers[0].envFrom[2]
          value:
            secretRef:
              name: RELEASE-NAME-secret
      - equal:
          path: spec.template.spec.containers[0].envFrom[3]
          value:
            secretRef:
              name: RELEASE-NAME-secret2

  - it: explicit envFrom with optional field should pass
    set:
      deployment:
        envFrom:
          - secretRef:
              name: myCustomSecret
              optional: true
          - configMapRef:
              name: myCustomConfig
              optional: true
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            secretRef:
              name: myCustomSecret
              optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            configMapRef:
              name: myCustomConfig
              optional: true
