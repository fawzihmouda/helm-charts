---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: container - fields - securityContext
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: default should pass
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: defaultContainerOption should pass
    set:
      deployment:
        defaultContainerOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsUser: 1000
            runAsGroup: 1000

  - it: defaultContainerOption with container override should pass
    set:
      deployment:
        defaultContainerOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        securityContext:
          runAsUser: 568
          runAsGroup: 568
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsUser: 568
            runAsGroup: 568

  - it: defaultContainerOption with merge strategy should pass
    set:
      deployment:
        defaultContainerOptionsStrategy: merge
        defaultContainerOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 568
            runAsNonRoot: true
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsUser: 0
            runAsGroup: 568
            runAsNonRoot: false
