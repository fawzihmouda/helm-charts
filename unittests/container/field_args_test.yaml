---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: container - fields - args
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: default should pass
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: single string should pass
    set:
      deployment:
        args: sleep infinity
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - sleep infinity

  - it: multiline string should pass
    set:
      deployment:
        args: "echo hello\necho world\n"
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - |-
              echo hello
              echo world

  - it: single quoted string should pass
    set:
      deployment:
        args: sleep infinity
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - sleep infinity

  - it: list of strings should pass
    set:
      deployment:
        args:
          - sleep
          - infinity
          - test
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - sleep
            - infinity
            - test

  - it: args from defaultContainerOptions should pass
    set:
      deployment:
        defaultContainerOptions:
          args: value_of_args
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - value_of_args

  - it: args from defaultContainerOptions with container override should pass
    set:
      deployment:
        defaultContainerOptions:
          args: value_of_args
        args:
          - value 1
          - value 2
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - value 1
            - value 2
