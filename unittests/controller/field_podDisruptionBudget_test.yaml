---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: controller - fields - podDisruptionBudget
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml

tests:
  - it: default should not exist
    asserts:
      - not: true
        containsDocument:
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          name: release-name
          any: true
  - it: created if maxUnavailable specified
    set:
      deployment:
        podDisruptionBudget:
          maxUnavailable: 10%
    documentSelector:
      path: $[?(@.kind == "PodDisruptionBudget")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 10%
      - notExists:
          path: spec.minAvailable
  - it: created if minAvailable specified
    set:
      deployment:
        podDisruptionBudget:
          minAvailable: 1
    documentSelector:
      path: $[?(@.kind == "PodDisruptionBudget")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxAvailable
  - it: pdb targets the correct controller by default
    set:
      deployment:
        podDisruptionBudget:
          minAvailable: 50%
    documentSelector:
      path: $[?(@.kind == "PodDisruptionBudget")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.selector
          value:
            matchLabels:
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME
