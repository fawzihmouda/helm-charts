---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: controller - presence
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: default should pass
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: release-name
          any: true

  - it: disabled should pass
    set:
      deployment:
        enabled: false
    asserts:
      - not: true
        containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: release-name
          any: true
