---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: controller - fields - defaultContainerOptions
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: default should pass
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - documentIndex: 0
        notExists:
          path: spec.template.spec.containers[0].resources

  - it: defaultContainerOption with implicit strategy should pass
    set:
      deployment:
        defaultContainerOptions:
          resources:
            requests:
              memory: 1Gi
              cpu: 150m
        resources:
          requests:
            memory: 2Gi
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              memory: 2Gi

  - it: defaultContainerOption with overwrite strategy should pass
    set:
      deployment:
        defaultContainerOptionsStrategy: overwrite
        defaultContainerOptions:
          resources:
            requests:
              memory: 1Gi
              cpu: 150m
        resources:
          requests:
            memory: 2Gi
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              memory: 2Gi

  - it: defaultContainerOption with merge strategy should pass
    set:
      deployment:
        defaultContainerOptionsStrategy: merge
        defaultContainerOptions:
          resources:
            requests:
              memory: 1Gi
              cpu: 150m
        resources:
          requests:
            memory: 2Gi
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              memory: 2Gi
              cpu: 150m

  - it: Default applyDefaultContainerOptionsToInitContainers (true) should pass
    set:
      deployment:
        defaultContainerOptions:
          resources:
            requests:
              memory: 1Gi
        initContainers:
          test:
            image:
              repository: ghcr.io/mendhak/http-https-echo
              tag: 31
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              memory: 1Gi
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              memory: 1Gi

  - it: applyDefaultContainerOptionsToInitContainers false should pass
    set:
      deployment:
        applyDefaultContainerOptionsToInitContainers: false
        defaultContainerOptions:
          resources:
            requests:
              memory: 1Gi
        initContainers:
          test:
            image:
              repository: ghcr.io/mendhak/http-https-echo
              tag: 31
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              memory: 1Gi
      - notExists:
          path: spec.template.spec.initContainers[0].resources
