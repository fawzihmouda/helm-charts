---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: podMonitor - fields - selector
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: a podMonitor can be configured with a custom selector
    set:
      podMonitor:
        main:
          selector:
            matchLabels:
              app: my-app
          podMetricsEndpoints:
            - port: http
              path: /metrics
    documentSelector:
      path: $[?(@.kind == "PodMonitor")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.selector
          value:
            matchLabels:
              app: my-app

  - it: an auto-detected controller includes its extra selector labels
    set:
      podMonitor:
        main:
          podMetricsEndpoints:
            - port: http
      deployment:
        extraSelectorLabels:
          component: app
    documentSelector:
      path: $[?(@.kind == "PodMonitor")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: RELEASE-NAME
            component: app

  - it: an explicitly empty selector is preserved without requiring a controller
    set:
      podMonitor:
        main:
          selector: {}
          podMetricsEndpoints:
            - port: http
      deployment:
        enabled: false
    documentSelector:
      path: $[?(@.kind == "PodMonitor")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.selector
          value: {}

  - it: a templated expression selector is preserved when controller extras are present
    set:
      podMonitor:
        main:
          selector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - '{{ .Release.Name }}'
          podMetricsEndpoints:
            - port: http
      deployment:
        extraSelectorLabels:
          component: app
    documentSelector:
      path: $[?(@.kind == "PodMonitor")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.selector
          value:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - RELEASE-NAME
