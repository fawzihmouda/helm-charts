---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: service - presence
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: service is not present by default
    asserts:
      - not: true
        containsDocument:
          kind: Service
          apiVersion: v1
          name: release-name
          any: true

  - it: services are enabled by default
    values:
      - ../_values/service_default.yaml
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: release-name
          any: true

  - it: service is not present when disabled
    values:
      - ../_values/service_default.yaml
    set:
      service:
        enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: Service
          apiVersion: v1
          name: release-name
          any: true
