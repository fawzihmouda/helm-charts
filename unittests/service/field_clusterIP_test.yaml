---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: service - fields - clusterIP
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
  - ../_values/service_default.yaml
tests:
  - it: clusterIP can be configured for ClusterIP service
    set:
      service:
        type: ClusterIP
        clusterIP: 10.0.0.10
    documentSelector:
      path: $[?(@.kind == "Service")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.clusterIP
          value: 10.0.0.10

  - it: clusterIP can be configured for NodePort service
    set:
      service:
        type: NodePort
        clusterIP: 10.0.0.11
    documentSelector:
      path: $[?(@.kind == "Service")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.clusterIP
          value: 10.0.0.11

  - it: clusterIP can be configured for LoadBalancer service
    set:
      service:
        type: LoadBalancer
        clusterIP: 10.0.0.12
    documentSelector:
      path: $[?(@.kind == "Service")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.clusterIP
          value: 10.0.0.12

  - it: clusterIP is omitted for ExternalName service
    set:
      service:
        type: ExternalName
        clusterIP: 10.0.0.13
        externalName: my.database.example.com
    documentSelector:
      path: $[?(@.kind == "Service")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: spec.clusterIP
