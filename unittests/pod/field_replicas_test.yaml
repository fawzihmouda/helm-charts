---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: pod - fields - replicas
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: default should pass
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: nil should pass
    set:
      deployment:
        replicas: null
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - documentIndex: 0
        notExists:
          path: spec.replicas

  - it: custom replicas should pass
    set:
      deployment:
        replicas: 3
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: release-name
    asserts:
      - documentIndex: 0
        equal:
          path: spec.replicas
          value: 3
