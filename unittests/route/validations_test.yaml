---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: route - validations
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: backend refs with redirect filter should fail
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - group: test
                  name: pathService
                  port: 1234
                  namespace: serviceNamespace
                  weight: 123
              filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
    asserts:
      - failedTemplate:
          errorMessage: "Route 'main': RequestRedirect filter cannot be used together with backendRefs. Remove either the filter or the backendRefs."

  - it: automatic service determination should fail when no service is enabled
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - port: 8080
    asserts:
      - failedTemplate:
          errorMessage: "Route 'main': backendRef needs a 'name' because the chart creates no Service. Set 'name' or configure 'service'."
