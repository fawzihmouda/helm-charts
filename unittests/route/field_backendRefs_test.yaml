---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: route - fields - backendRefs
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: backendRefs can be configured by passing in a service name
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - group: ''
                  kind: Service
                  name: RELEASE-NAME
                  namespace: NAMESPACE
                  port: 8080
                  weight: 1
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: RELEASE-NAME
            namespace: NAMESPACE
            port: 8080
            weight: 1

  - it: backendRefs without a name target the chart's Service by port number or port name
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - port: 8080
            - backendRefs:
                - port: http
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: release-name
            namespace: NAMESPACE
            port: 8080
            weight: 1
      - equal:
          path: spec.rules[1].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: release-name
            namespace: NAMESPACE
            port: 8081
            weight: 1

  - it: backendRefs can be configured without a port
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - group: traefik.io
                  kind: TraefikService
                  name: noop@internal
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: traefik.io
            kind: TraefikService
            name: noop@internal
            namespace: NAMESPACE
            weight: 1

  - it: automatic service and port reference should pass
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - {}
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: release-name
            namespace: NAMESPACE
            port: 8081
            weight: 1

  - it: custom service reference should pass
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - group: test
                  name: pathService
                  port: 1234
                  namespace: serviceNamespace
                  weight: 123
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: test
            kind: Service
            name: pathService
            namespace: serviceNamespace
            port: 1234
            weight: 123

  - it: custom service with filter should pass
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].filters[0]
          value:
            type: RequestRedirect
            requestRedirect:
              scheme: https
              statusCode: 301
      - notExists:
          path: spec.rules[0].backendRefs[0]

  - it: automatic service and port reference should pass with empty rules
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules: []
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: release-name
            namespace: NAMESPACE
            port: 8081
            weight: 1

  - it: automatic service and port reference should pass with absent rules field
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            group: ""
            kind: Service
            name: release-name
            namespace: NAMESPACE
            port: 8081
            weight: 1

  - it: multiple backendRefs can be configured
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
              namespace: parentNamespace
          rules:
            - backendRefs:
                - group: ''
                  kind: Service
                  name: RELEASE-NAME
                  namespace: NAMESPACE
                  port: 8080
                  weight: 1
                - port: 8080
                - port: http
    documentSelector:
      path: $[?(@.kind == "HTTPRoute")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME
      - equal:
          path: spec.rules[0].backendRefs[1].name
          value: release-name
      - equal:
          path: spec.rules[0].backendRefs[2].name
          value: release-name

  - it: a port name fails when it isn't a port of the chart's Service
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
          rules:
            - backendRefs:
                - port: missing
    asserts:
      - failedTemplate:
          errorPattern: "Route 'main': can't resolve port 'missing'"

  - it: a port name fails on a backendRef with a name
    values:
      - ../_values/service_default.yaml
    set:
      route:
        main:
          parentRefs:
            - name: parentName
          rules:
            - backendRefs:
                - name: other-service
                  port: http
    asserts:
      - failedTemplate:
          errorPattern: "Route 'main': can't resolve port 'http'"
