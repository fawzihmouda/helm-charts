---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: configmap - presence
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: configMap should not be rendered by default
    asserts:
      - not: true
        containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: release-name
          any: true

  - it: with disabled configMap
    set:
      configMaps:
        config:
          enabled: false
          data:
            test: test
    asserts:
      - not: true
        containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: release-name
          any: true

  - it: with multiple configMaps
    set:
      configMaps:
        config:
          data:
            foo: bar
        secondary:
          data:
            test: test
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: release-name-config
          any: true
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: release-name-secondary
          any: true
