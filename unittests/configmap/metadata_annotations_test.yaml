---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: configmap - metadata - annotations
templates:
  - common.yaml
values:
  - ../_values/deployment_default.yaml
tests:
  - it: no annotations are set by default
    set:
      configMaps:
        config:
          data:
            test: test
    documentSelector:
      path: $[?(@.kind == "ConfigMap")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: metadata.annotations

  - it: custom annotations
    set:
      configMaps:
        config:
          data:
            test: test
          annotations:
            test_annotation: test
    documentSelector:
      path: $[?(@.kind == "ConfigMap")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations
          value:
            test_annotation: test

  - it: custom annotations mixed with global annotations
    set:
      global:
        annotations:
          global_annotation: test
      configMaps:
        config:
          data:
            test: test
          annotations:
            test_annotation: test
    documentSelector:
      path: $[?(@.kind == "ConfigMap")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations
          value:
            global_annotation: test
            test_annotation: test

  - it: resource annotations override global annotations
    set:
      global:
        annotations:
          test_annotation: global
      configMaps:
        config:
          data:
            test: test
          annotations:
            test_annotation: configmap
    documentSelector:
      path: $[?(@.kind == "ConfigMap")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations.test_annotation
          value: configmap
