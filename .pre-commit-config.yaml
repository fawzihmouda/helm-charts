default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
# Go templates aren't YAML, README.md is generated by helm-docs and snapshots
# are golden test output.
exclude: ^templates/|^README\.md$|/__snapshot__/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: helm lint .
        language: system
        pass_filenames: false
      - id: helm-template-ci
        name: helm template ci values
        entry: bash -c 'for f in ci/*.yaml; do helm template t . -f "$f" > /dev/null || { echo "failed $f"; exit 1; }; done'
        language: system
        pass_filenames: false
      - id: helm-docs
        name: helm-docs
        entry: helm-docs --chart-search-root .
        language: system
        pass_filenames: false
        files: ^(Chart\.yaml|values\.yaml|README\.md\.gotmpl)$
      # About 20 seconds, so it runs at push to keep commits fast.
      - id: helm-unittest
        name: helm unittest
        entry: helm unittest -f 'unittests/**/*_test.yaml' .
        language: system
        pass_filenames: false
        stages: [pre-push]
