name: Publish Helm charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/scripts/**"
      - ".github/workflows/publish-charts.yaml"

permissions:
  contents: read

env:
  CHART_NAMESPACE: ${{ github.repository }}
  HELM_VERSION: v4.2.0
  REGISTRY: ghcr.io

jobs:
  select:
    name: Select charts
    runs-on: ubuntu-24.04
    outputs:
      chart_count: ${{ steps.select.outputs.chart_count }}
      charts_json: ${{ steps.select.outputs.charts_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Select charts
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/select-charts.sh

  validate:
    name: Validate ${{ matrix.chart }}
    needs: select
    if: needs.select.outputs.chart_count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        chart: ${{ fromJson(needs.select.outputs.charts_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/helm-registry-login.sh

      - name: Validate chart
        env:
          CHART_PATH: ${{ matrix.chart }}
        run: .github/scripts/validate-chart.sh

      - name: Check unpublished chart version
        env:
          CHART_PATH: ${{ matrix.chart }}
        run: .github/scripts/check-chart-unpublished.sh

  publish:
    name: Publish ${{ matrix.chart }}
    needs:
      - select
      - validate
    if: needs.select.outputs.chart_count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chart: ${{ fromJson(needs.select.outputs.charts_json) }}
    concurrency:
      group: helm-publish-${{ github.repository }}-${{ matrix.chart }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/helm-registry-login.sh

      - name: Package chart
        env:
          CHART_PATH: ${{ matrix.chart }}
        run: .github/scripts/package-chart.sh

      - name: Check chart version
        env:
          CHART_PATH: ${{ matrix.chart }}
        run: .github/scripts/check-chart-unpublished.sh

      - name: Push chart
        run: .github/scripts/push-chart.sh
