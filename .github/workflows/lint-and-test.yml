name: Lint and Test
on: pull_request

permissions: {}

# A new push to the pull request cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install the helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "${VERSION}" --verify=false
        env:
          VERSION: 1.0.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: v3.15.0

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/configs/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Lints the chart with every file in ci/ and runs the unit tests.
      # main still has version 1.0.0 from the earlier, unpublished chart, so the
      # version check is skipped until chart-releaser has tagged the first release.
      - name: Run chart-testing (lint)
        run: |
          args=()
          if [[ -z "$(git tag --list)" ]]; then
            echo "No release yet, so the version check is skipped."
            args+=(--check-version-increment=false)
          fi
          ct lint --config .github/configs/ct.yaml --lint-conf .github/configs/lintconf.yaml "${args[@]}"

      - name: Check that README.md is generated from README.md.gotmpl
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/helm-docs" --user "$(id -u)" jnorwood/helm-docs:v1.14.2
          git diff --exit-code

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      # ci/httproute-values.yaml needs the HTTPRoute CRD.
      - name: Install the Gateway API CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/standard-install.yaml

      # Installs the chart once for every file in ci/.
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config .github/configs/ct.yaml
