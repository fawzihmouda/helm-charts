{{- $p := .Values.persistence }}
{{- if and $p.enabled (not $p.existingClaim) (not (and .Values.workload.enabled (eq (include "application.workloadKind" .) "StatefulSet"))) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "application.pvcName" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list $p.additionalLabels)) | nindent 4 }}
  {{- with $p.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "application.pvcSpec" . | nindent 2 }}
{{- end }}
