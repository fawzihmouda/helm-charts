{{- if .Values.httpRoute.enabled }}
{{- $r := .Values.httpRoute }}
{{- if not (or $r.parentRefs $r.useDefaultGateways) }}
{{- fail "httpRoute needs parentRefs or useDefaultGateways" }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "application.fullname" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list $r.additionalLabels)) | nindent 4 }}
  {{- with $r.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $r.parentRefs }}
  parentRefs:
    {{- include "application.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $r.useDefaultGateways }}
  useDefaultGateways: {{ . }}
  {{- end }}
  {{- with $r.hostnames }}
  hostnames:
    {{- include "application.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  rules:
  {{- with $r.rules }}
    {{- include "application.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- else }}
    {{- if not (and .Values.service.enabled .Values.workload.enabled) }}
    {{- fail "httpRoute.rules is required when the chart creates no Service" }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "application.fullname" . | quote }}
          port: {{ (first .Values.service.ports).port }}
  {{- end }}
{{- end }}
