{{- if .Values.configMap.enabled }}
{{- range $nameSuffix, $configMap := .Values.configMap.items }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "application.fullname" $) $nameSuffix | quote }}
  namespace: {{ include "application.namespace" $ | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" $ "extra" (list $.Values.configMap.labels)) | nindent 4 }}
  {{- with $.Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "application.fields" (dict "from" $configMap "indent" 0 "names" (list "immutable" "binaryData")) }}
{{- with $configMap.data }}
data:
  {{- range $key, $value := . }}
  {{- /* Helm reads numbers as floats; toJson keeps 10485760 instead of 1.048576e+07. */}}
  {{ $key | quote }}: {{ kindIs "string" $value | ternary (tpl (toString $value) $) (toJson $value) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
