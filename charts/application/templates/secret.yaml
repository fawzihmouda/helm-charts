{{- if .Values.secret.enabled }}
{{- range $nameSuffix, $secret := .Values.secret.items }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "application.fullname" $) $nameSuffix | quote }}
  namespace: {{ include "application.namespace" $ | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" $ "extra" (list $.Values.secret.additionalLabels)) | nindent 4 }}
  {{- with $.Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "application.fields" (dict "from" $secret "indent" 0 "names" (list "type" "immutable" "stringData")) }}
{{- if or $secret.data $secret.encodedData }}
data:
  {{- range $key, $value := $secret.data }}
  {{- /* Maps and lists are stored as JSON, for example a dockerconfigjson. */}}
  {{ $key | quote }}: {{ kindIs "string" $value | ternary $value (toJson $value) | b64enc }}
  {{- end }}
  {{- with $secret.encodedData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
