{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "application.serviceAccountName" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list .Values.serviceAccount.additionalLabels)) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
