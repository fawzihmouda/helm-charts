{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
{{- include "application.fields" (dict "from" .Values.serviceAccount "indent" 0 "names" (list "automountServiceAccountToken")) }}
metadata:
  name: {{ include "application.serviceAccountName" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list .Values.serviceAccount.labels)) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
