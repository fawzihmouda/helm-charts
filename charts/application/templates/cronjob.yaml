{{- if .Values.cronJob.enabled }}
{{- range $name, $job := .Values.cronJob.jobs }}
{{- /* 52 characters, so the Jobs a CronJob spawns stay within 63. */}}
{{- $fullName := include "application.jobName" (dict "name" $name "job" $job "max" 52 "context" $) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ include "application.namespace" $ | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" $ "extra" (list (dict "app.kubernetes.io/name" $fullName) $job.labels)) | nindent 4 }}
  {{- with $job.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- include "application.fields" (dict "from" $job "indent" 2 "names" (list
    "timeZone" "suspend" "concurrencyPolicy" "startingDeadlineSeconds"
    "successfulJobsHistoryLimit" "failedJobsHistoryLimit")) }}
  jobTemplate:
    spec:
      {{- include "application.jobSpec" (dict "name" $fullName "job" $job "context" $) | nindent 6 }}
{{- end }}
{{- end }}
