{{- if and .Values.pdb.enabled .Values.workload.enabled }}
{{- if eq (include "application.workloadKind" .) "DaemonSet" }}
{{- fail "pdb.enabled can't be used with workload.kind DaemonSet: the PDB can't compute disruptions for it and blocks every eviction" }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "application.fullname" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list .Values.pdb.additionalLabels)) | nindent 4 }}
  {{- with .Values.pdb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not (kindIs "invalid" .Values.pdb.minAvailable) }}
  minAvailable: {{ toJson .Values.pdb.minAvailable }}
  {{- else if not (kindIs "invalid" .Values.pdb.maxUnavailable) }}
  maxUnavailable: {{ toJson .Values.pdb.maxUnavailable }}
  {{- end }}
  {{- with .Values.pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "application.selectorLabels" . | nindent 6 }}
{{- end }}
