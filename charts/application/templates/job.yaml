{{- if .Values.job.enabled }}
{{- range $name, $job := .Values.job.jobs }}
{{- /* 54 characters leave room for the 9-character hash suffix. */}}
{{- $baseName := include "application.jobName" (dict "name" $name "job" $job "max" 54 "context" $) }}
{{- $hooks := get (default dict $job.annotations) "helm.sh/hook" | toString }}
{{- if and (contains "pre-install" $hooks) $.Values.serviceAccount.create (not (hasKey (default dict $.Values.serviceAccount.annotations) "helm.sh/hook")) }}
{{- fail (printf "job %q is a pre-install hook, which runs before the chart's Service Account exists: use post-install, or make the Service Account a hook through serviceAccount.annotations" $name) }}
{{- end }}
{{- $spec := include "application.jobSpec" (dict "name" $baseName "job" $job "context" $) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* A Job's pod template is immutable, so a spec change creates a new Job and Helm removes the old one.
  Hook Jobs keep a fixed name so the hook delete policy can find the previous run. */}}
  {{- if hasKey (default dict $job.annotations) "helm.sh/hook" }}
  name: {{ $baseName | quote }}
  {{- else }}
  name: {{ $baseName }}-{{ sha256sum $spec | trunc 8 }}
  {{- end }}
  namespace: {{ include "application.namespace" $ | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" $ "extra" (list (dict "app.kubernetes.io/name" $baseName) $job.labels)) | nindent 4 }}
  {{- with $job.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* suspend can change on a live Job, so it stays out of the hashed spec. */}}
  {{- include "application.fields" (dict "from" $job "indent" 2 "names" (list "suspend")) }}
  {{- $spec | nindent 2 }}
{{- end }}
{{- end }}
