{{- $r := .Values.rbac }}
{{- if and $r.create (or $r.roles $r.clusterRoles) }}
{{- if eq (include "application.serviceAccountName" .) "default" }}
{{- fail "rbac roles need serviceAccount.create or serviceAccount.name, so they aren't granted to the namespace's default account" }}
{{- end }}
{{- range $kind, $roles := dict "Role" $r.roles "ClusterRole" $r.clusterRoles }}
{{- range $role := $roles }}
{{- $roleName := printf "%s-%s" (include "application.fullname" $) $role.name }}
{{- if eq $kind "ClusterRole" }}
{{- /* Cluster-scoped names include the namespace, so the same release name can exist in two namespaces. */}}
{{- $roleName = printf "%s-%s" (include "application.namespace" $) $roleName }}
{{- end }}
{{- range $suffix := list "" "Binding" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}{{ $suffix }}
metadata:
  name: {{ $roleName | quote }}
  {{- if eq $kind "Role" }}
  namespace: {{ include "application.namespace" $ | quote }}
  {{- end }}
  labels:
    {{- include "application.labelsWith" (dict "context" $ "extra" (list $r.additionalLabels)) | nindent 4 }}
  {{- with $r.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if $suffix }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ $roleName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "application.serviceAccountName" $ | quote }}
    namespace: {{ include "application.namespace" $ | quote }}
{{- else }}
rules:
  {{- toYaml $role.rules | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
