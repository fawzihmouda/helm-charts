{{- if .Values.networkPolicy.enabled }}
{{- $n := .Values.networkPolicy }}
{{- $ingress := not (kindIs "invalid" $n.ingress) }}
{{- $egress := not (kindIs "invalid" $n.egress) }}
{{- $names := list (include "application.fullname" .) }}
{{- range $jobs := list .Values.job .Values.cronJob }}
{{- if $jobs.enabled }}
{{- range $name, $_ := $jobs.jobs }}
{{- $names = append $names (printf "%s-%s" (include "application.fullname" $) $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not (or $ingress $egress) }}
{{- fail "networkPolicy.enabled needs networkPolicy.ingress or networkPolicy.egress: set rules, or [] to deny all" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "application.fullname" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list $n.additionalLabels)) | nindent 4 }}
  {{- with $n.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* The name labels of the workload pods and of every Job and CronJob pod. User labels can't replace them. */}}
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: {{ toJson $names }}
  {{- /* A listed policy type with no rules denies all traffic of that type. */}}
  policyTypes:
    {{- if $ingress }}
    - Ingress
    {{- end }}
    {{- if $egress }}
    - Egress
    {{- end }}
  {{- with $n.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $n.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
