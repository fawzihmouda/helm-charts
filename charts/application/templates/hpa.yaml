{{- if and .Values.autoscaling.enabled .Values.workload.enabled }}
{{- $kind := include "application.workloadKind" . }}
{{- $_ := required "autoscaling.maxReplicas is required" .Values.autoscaling.maxReplicas }}
{{- if eq $kind "DaemonSet" }}
{{- fail "autoscaling.enabled can't be used with workload.kind DaemonSet" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "application.fullname" . | quote }}
  namespace: {{ include "application.namespace" . | quote }}
  labels:
    {{- include "application.labelsWith" (dict "context" . "extra" (list .Values.autoscaling.labels)) | nindent 4 }}
  {{- with .Values.autoscaling.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ $kind }}
    name: {{ include "application.fullname" . | quote }}
  {{- include "application.fields" (dict "from" .Values.autoscaling "indent" 2 "names" (list "minReplicas" "maxReplicas" "metrics" "behavior")) }}
{{- end }}
