suite: test service
templates:
  - service.yaml
release:
  name: demo
set:
  fullnameOverride: demo
  workload.image.repository: nginx
tests:
  - it: skips the Service when there is no long-running workload
    set:
      workload.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the optional Service fields
    set:
      service.type: LoadBalancer
      service.externalTrafficPolicy: Local
      service.sessionAffinity: ClientIP
      service.loadBalancerSourceRanges:
        - 10.0.0.0/8
    asserts:
      - isSubset:
          path: spec
          content:
            type: LoadBalancer
            externalTrafficPolicy: Local
            sessionAffinity: ClientIP
            loadBalancerSourceRanges:
              - 10.0.0.0/8

  - it: adds a headless Service for a StatefulSet
    documentIndex: 1
    set:
      workload.kind: StatefulSet
    asserts:
      - equal:
          path: metadata.name
          value: demo-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: application
            app.kubernetes.io/instance: demo

  - it: keeps the headless Service when the main Service is disabled
    set:
      workload.kind: StatefulSet
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: demo-headless

  - it: accepts the enabled key an umbrella chart's condition uses
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: lets a resource label override a common label without duplicating it
    set:
      additionalLabels:
        team: platform
      service.labels:
        team: payments
    asserts:
      - equal:
          path: metadata.labels.team
          value: payments

  - it: rejects a non-string annotation
    set:
      service.annotations:
        prometheus.io/scrape: true
    asserts:
      - failedTemplate:
          errorPattern: "/service/annotations/prometheus.io~1scrape"

  - it: leaves nodePort off the headless Service, which can't have one
    set:
      workload.kind: StatefulSet
      service.type: NodePort
      service.ports:
        - port: 80
          name: http
          nodePort: 30080
    asserts:
      - equal:
          path: spec.ports[0].nodePort
          value: 30080
        documentIndex: 0
      - equal:
          path: spec.ports
          value:
            - port: 80
              name: http
        documentIndex: 1

  - it: renders externalTrafficPolicy only for a Service that takes external traffic
    set:
      service.externalTrafficPolicy: Local
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy

  - it: requires Service ports
    set:
      service.ports: []
    asserts:
      - failedTemplate:
          errorPattern: service.ports
