suite: test job
templates:
  - job.yaml
release:
  name: demo
set:
  fullnameOverride: demo
  workload.image.repository: nginx
  workload.image.tag: "1.0.0"
  job.enabled: true
  job.jobs.migrate:
    image:
      repository: busybox
    command: ["sh", "-c", "echo hi"]
  cronJob.enabled: true
  cronJob.jobs.cleanup:
    schedule: "0 * * * *"
    timeZone: Australia/Sydney
    startingDeadlineSeconds: 60
    image:
      repository: busybox
    command: ["sh", "-c", "echo hi"]
tests:
  - it: renders the Job command as a list
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["sh", "-c", "echo hi"]

  - it: rejects startingDeadlineSeconds on a Job, which has no such field
    set:
      job.jobs.migrate.startingDeadlineSeconds: 60
    asserts:
      - failedTemplate:
          errorPattern: additional properties 'startingDeadlineSeconds' not allowed

  - it: uses the default service account when the chart creates none
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: restarts failed job containers by default
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure

  - it: gives job pods their own name label so the Service doesn't select them
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: demo-migrate

  - it: names the Job with a hash of its spec
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^demo-migrate-[0-9a-f]{8}$

  - it: keeps a fixed name for hook Jobs so the delete policy finds the last run
    set:
      job.jobs.migrate.annotations:
        helm.sh/hook: post-install,pre-upgrade
    asserts:
      - equal:
          path: metadata.name
          value: demo-migrate

  - it: rejects a job name that is too long instead of truncating it
    set:
      fullnameOverride: a-very-long-application-name-for-testing-purposes
    asserts:
      - failedTemplate:
          errorPattern: has 57 characters, the limit is 54

  - it: renders the Job fields
    set:
      job.jobs.migrate.suspend: true
      job.jobs.migrate.parallelism: 2
      job.jobs.migrate.completions: 4
      job.jobs.migrate.completionMode: Indexed
    asserts:
      - equal:
          path: spec.suspend
          value: true
      - equal:
          path: spec.parallelism
          value: 2
      - equal:
          path: spec.completions
          value: 4
      - equal:
          path: spec.completionMode
          value: Indexed

  - it: renders large integers as written
    set:
      # A float, because that is how Helm reads every number in a values file.
      job.jobs.migrate.ttlSecondsAfterFinished: 1209600.0
    asserts:
      - isType:
          path: spec.ttlSecondsAfterFinished
          type: int
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 1209600

  - it: keeps the chart and workload version labels off the job pods, so neither bump reruns the Job
    chart:
      version: 9.9.9
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^demo-migrate-[0-9a-f]{8}$
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]

  - it: gives job containers the workload's security context and a writable /tmp by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: writable-tmp
            mountPath: /tmp

  - it: lets a job opt out of the default security context and /tmp
    set:
      job.jobs.migrate.containerSecurityContext: {}
      job.jobs.migrate.writableTmp: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext
      - notExists:
          path: spec.template.spec.volumes

  - it: uses restartPolicy Never with a podFailurePolicy, which Kubernetes requires
    set:
      job.jobs.migrate.podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              operator: In
              values: [42]
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: doesn't let podLabels replace the name and instance labels of job pods
    set:
      job.jobs.migrate.podLabels:
        app.kubernetes.io/name: application
        app.kubernetes.io/instance: other
        example.com/team: platform
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: demo-migrate
            app.kubernetes.io/instance: demo
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: demo
            example.com/team: platform

  - it: labels the Job with its own name, so a Service selector can't match it
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: demo-migrate

  - it: leaves room in an Indexed Job's name for the pod index
    set:
      fullnameOverride: a-long-application-name-for-testing-purposes
      job.jobs.migrate.completionMode: Indexed
      job.jobs.migrate.completions: 100
    asserts:
      - failedTemplate:
          errorPattern: has 52 characters, the limit is 51

  - it: rejects a pre-install hook Job that needs the chart's Service Account
    set:
      serviceAccount.create: true
      job.jobs.migrate.annotations:
        helm.sh/hook: pre-install
    asserts:
      - failedTemplate:
          errorPattern: runs before the chart's Service Account exists
