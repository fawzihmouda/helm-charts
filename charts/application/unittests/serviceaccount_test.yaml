suite: test serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: demo
set:
  fullnameOverride: demo
  workload.image.repository: nginx
tests:
  - it: creates a Service Account by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: demo
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: renders automountServiceAccountToken false
    set:
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: creates no Service Account when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
