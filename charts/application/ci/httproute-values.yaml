workload:
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: "6.17.0"
  # podinfo sets CMD, not ENTRYPOINT, so the command must name the binary.
  command: ["./podinfo", "--port=8080"]
  # podinfo's image user is a name, so runAsNonRoot needs a UID.
  securityContext:
    runAsUser: 1000

# Needs the Gateway API CRDs. The Gateway doesn't have to exist.
httpRoute:
  enabled: true
  parentRefs:
    - name: example-gateway
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: '{{ include "application.fullname" . }}'
          port: 8080
