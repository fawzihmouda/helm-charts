# DaemonSet node agent with no Service.
workload:
  kind: DaemonSet
  image:
    repository: busybox
    tag: "1.37"
  command: ["sh", "-c"]
  args: ["while true; do echo agent on $(NODE_NAME); sleep 60; done"]
  env:
    NODE_NAME:
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  tolerations:
    - operator: Exists
  # busybox runs as root by default, which the default security context rejects.
  securityContext:
    runAsUser: 65534

service:
  enabled: false
