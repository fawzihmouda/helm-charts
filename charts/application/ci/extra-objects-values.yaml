workload:
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: "6.17.0"
  # podinfo sets CMD, not ENTRYPOINT, so the command must name the binary.
  command: ["./podinfo", "--port=8080"]
  # podinfo's image user is a name, so runAsNonRoot needs a UID.
  securityContext:
    runAsUser: 1000

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "application.fullname" . }}-extra'
    data:
      release: '{{ .Release.Name }}'
  # The string form renders the selector labels as YAML.
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ include "application.fullname" . }}-metrics
    spec:
      selector:
        {{- include "application.selectorLabels" . | nindent 4 }}
      ports:
        - name: metrics
          port: 9797
          targetPort: 8080
