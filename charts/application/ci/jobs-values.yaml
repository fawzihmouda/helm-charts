# Batch-only release: no long-running workload, so no Service.
workload:
  enabled: false

persistence:
  enabled: true
  storageSize: 1Gi

job:
  enabled: true
  jobs:
    seed:
      image:
        repository: busybox
        tag: "1.37"
      command: ["sh", "-c", "echo seeded > /data/seed && cat /data/seed"]
      backoffLimit: 1
      # busybox runs as root by default, which the default security context rejects.
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: '{{ include "application.fullname" . }}-data'
      volumeMounts:
        - name: data
          mountPath: /data
    indexed:
      image:
        repository: busybox
        tag: "1.37"
      command: ["sh", "-c", "echo index $JOB_COMPLETION_INDEX"]
      completionMode: Indexed
      completions: 2
      parallelism: 2
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              operator: In
              values: [42]
      securityContext:
        runAsUser: 1000

cronJob:
  enabled: true
  jobs:
    report:
      schedule: "0 3 * * *"
      timeZone: Australia/Sydney
      concurrencyPolicy: Forbid
      suspend: true
      image:
        repository: busybox
        tag: "1.37"
      command: ["sh", "-c", "date"]
      securityContext:
        runAsUser: 1000
