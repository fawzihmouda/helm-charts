workload:
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: "6.17.0"
  # podinfo sets CMD, not ENTRYPOINT, so the command must name the binary.
  command: ["./podinfo", "--port=8080"]
  # podinfo's image user is a name, so runAsNonRoot needs a UID.
  securityContext:
    runAsUser: 1000
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

pdb:
  enabled: true
  maxUnavailable: 1
