suite: supporting resources
release:
  name: demo
set:
  workload.image.repository: nginx
tests:
  - it: routes the default HTTPRoute rule to the first Service port as a number
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: gw
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: demo
            port: 8080

  - it: requires parentRefs or useDefaultGateways for an HTTPRoute
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: httpRoute needs parentRefs or useDefaultGateways

  - it: accepts useDefaultGateways without parentRefs
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.useDefaultGateways: All
    asserts:
      - equal:
          path: spec.useDefaultGateways
          value: All
      - notExists:
          path: spec.parentRefs

  - it: requires HTTPRoute rules when there is no Service
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: gw
      service.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.rules is required when the chart creates no Service

  - it: binds Roles to the service account in the overridden namespace
    template: templates/role.yaml
    documentIndex: 1
    set:
      namespaceOverride: apps
      serviceAccount.create: true
      rbac.roles:
        - name: read
          rules: []
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: demo-read
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: demo
            namespace: apps

  - it: binds ClusterRoles with a name that includes the namespace
    template: templates/role.yaml
    documentIndex: 1
    release:
      namespace: apps
    set:
      serviceAccount.create: true
      rbac.clusterRoles:
        - name: nodes
          rules: []
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: apps-demo-nodes
      - notExists:
          path: metadata.namespace
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: apps-demo-nodes

  - it: refuses to bind roles to the namespace's default account
    template: templates/role.yaml
    set:
      rbac.roles:
        - name: read
          rules: []
    asserts:
      - failedTemplate:
          errorPattern: rbac roles need serviceAccount.create

  - it: creates no roles when rbac.create is false
    template: templates/role.yaml
    set:
      rbac.create: false
      rbac.roles:
        - name: read
          rules: []
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults the PDB to maxUnavailable 1
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
    asserts:
      - equal:
          path: spec
          value:
            maxUnavailable: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: demo
                app.kubernetes.io/instance: demo

  - it: allows minAvailable 0
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
      pdb.minAvailable: 0
      pdb.maxUnavailable: null
    asserts:
      - equal:
          path: spec.minAvailable
          value: 0

  - it: renders only minAvailable when it is set
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
      pdb.minAvailable: 50%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 50%
      - notExists:
          path: spec.maxUnavailable

  - it: renders the PDB labels and eviction policy
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
      pdb.additionalLabels:
        team: platform
      pdb.unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: rejects a PDB for a DaemonSet
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
      workload.kind: DaemonSet
    asserts:
      - failedTemplate:
          errorPattern: can't be used with workload.kind DaemonSet

  - it: skips the Service when there is no long-running workload
    template: templates/service.yaml
    set:
      workload.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the optional Service fields
    template: templates/service.yaml
    set:
      service.type: LoadBalancer
      service.externalTrafficPolicy: Local
      service.sessionAffinity: ClientIP
      service.loadBalancerSourceRanges:
        - 10.0.0.0/8
    asserts:
      - isSubset:
          path: spec
          content:
            type: LoadBalancer
            externalTrafficPolicy: Local
            sessionAffinity: ClientIP
            loadBalancerSourceRanges:
              - 10.0.0.0/8

  - it: adds a headless Service for a StatefulSet
    template: templates/service.yaml
    documentIndex: 1
    set:
      workload.kind: StatefulSet
    asserts:
      - equal:
          path: metadata.name
          value: demo-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: demo
            app.kubernetes.io/instance: demo

  - it: keeps the headless Service when the main Service is disabled
    template: templates/service.yaml
    set:
      workload.kind: StatefulSet
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: demo-headless

  - it: accepts the enabled key an umbrella chart's condition uses
    template: templates/service.yaml
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: lets a resource label override a common label without duplicating it
    template: templates/service.yaml
    set:
      additionalLabels:
        team: platform
      service.additionalLabels:
        team: payments
    asserts:
      - equal:
          path: metadata.labels.team
          value: payments

  - it: rejects a non-string annotation
    template: templates/service.yaml
    set:
      service.annotations:
        prometheus.io/scrape: true
    asserts:
      - failedTemplate:
          errorPattern: "/service/annotations/prometheus.io~1scrape"

  - it: targets the workload kind from the HPA
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      workload.kind: StatefulSet
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 10

  - it: rejects an HPA for a DaemonSet
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      workload.kind: DaemonSet
    asserts:
      - failedTemplate:
          errorPattern: DaemonSet

  - it: doesn't create a shared PVC for a StatefulSet
    template: templates/pvc.yaml
    set:
      persistence.enabled: true
      workload.kind: StatefulSet
    asserts:
      - hasDocuments:
          count: 0

  - it: disables dynamic provisioning for an empty storage class
    template: templates/pvc.yaml
    set:
      persistence.enabled: true
      persistence.storageClass: ""
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""

  - it: base64-encodes non-string Secret data
    template: templates/secret.yaml
    set:
      secret.enabled: true
      secret.items.db.data.port: 5432
    asserts:
      - equal:
          path: metadata.name
          value: demo-db
      - equal:
          path: data.port
          value: NTQzMg==
      - notExists:
          path: stringData

  - it: stores map Secret data as JSON
    template: templates/secret.yaml
    set:
      secret.enabled: true
      secret.items.pull.type: kubernetes.io/dockerconfigjson
      secret.items.pull.data:
        .dockerconfigjson:
          auths: {}
    asserts:
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6e319

  - it: renders ConfigMap values as strings
    template: templates/configmap.yaml
    set:
      configMap.enabled: true
      configMap.items.settings.data:
        PORT: 8080
        DEBUG: true
    asserts:
      - equal:
          path: data
          value:
            PORT: "8080"
            DEBUG: "true"

  - it: keeps large ConfigMap numbers as written
    template: templates/configmap.yaml
    set:
      configMap.enabled: true
      configMap.items.settings.data.MAX_BYTES: 10485760
    asserts:
      - equal:
          path: data.MAX_BYTES
          value: "10485760"

  - it: renders binaryData and immutable on a ConfigMap
    template: templates/configmap.yaml
    set:
      configMap.enabled: true
      configMap.items.assets:
        immutable: true
        binaryData:
          logo.png: iVBORw0KGgo=
    asserts:
      - equal:
          path: immutable
          value: true
      - equal:
          path: binaryData["logo.png"]
          value: iVBORw0KGgo=
      - notExists:
          path: data

  - it: lists only the policy types that have rules set
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress: []
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Egress]
      - notExists:
          path: spec.egress

  - it: rejects a NetworkPolicy with neither ingress nor egress, which would deny all ingress
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: networkPolicy.enabled needs networkPolicy.ingress or networkPolicy.egress

  - it: selects the workload pods and the job pods in the NetworkPolicy
    template: templates/networkpolicy.yaml
    set:
      fullnameOverride: web
      networkPolicy.enabled: true
      networkPolicy.ingress: []
      # podLabels can't take a pod out of the policy: it selects on names the chart sets.
      workload.podLabels:
        app.kubernetes.io/part-of: other
      job.enabled: true
      job.jobs.migrate.image.repository: busybox
      cronJob.enabled: true
      cronJob.jobs.cleanup:
        schedule: "0 * * * *"
        image:
          repository: busybox
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/instance: demo
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [web, web-migrate, web-cleanup]

  - it: puts extraObjects in the overridden namespace
    template: templates/extraobjects.yaml
    set:
      namespaceOverride: apps
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: extra
    asserts:
      - equal:
          path: metadata.namespace
          value: apps

  - it: renders a string extraObject that embeds the selector labels
    template: templates/extraobjects.yaml
    set:
      extraObjects:
        - |
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: {{ include "application.fullname" . }}
          spec:
            selector:
              matchLabels:
                {{- include "application.selectorLabels" . | nindent 8 }}
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: demo
            app.kubernetes.io/instance: demo

  - it: merges the chart labels into an extraObject's own labels
    template: templates/extraobjects.yaml
    set:
      extraObjects:
        - apiVersion: monitoring.coreos.com/v1alpha1
          kind: AlertmanagerConfig
          metadata:
            name: '{{ include "application.fullname" . }}'
            labels:
              alertmanagerConfig: workload
    asserts:
      - equal:
          path: metadata.name
          value: demo
      - equal:
          path: metadata.labels.alertmanagerConfig
          value: workload
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: demo

  - it: leaves nodePort off the headless Service, which can't have one
    template: templates/service.yaml
    set:
      workload.kind: StatefulSet
      service.type: NodePort
      service.ports:
        - port: 80
          name: http
          nodePort: 30080
    asserts:
      - equal:
          path: spec.ports[0].nodePort
          value: 30080
        documentIndex: 0
      - equal:
          path: spec.ports
          value:
            - port: 80
              name: http
        documentIndex: 1

  - it: renders externalTrafficPolicy only for a Service that takes external traffic
    template: templates/service.yaml
    set:
      service.externalTrafficPolicy: Local
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy

  - it: requires Service ports
    template: templates/service.yaml
    set:
      service.ports: []
    asserts:
      - failedTemplate:
          errorPattern: service.ports

  - it: requires maxReplicas for an HPA
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.maxReplicas: null
    asserts:
      - failedTemplate:
          errorPattern: autoscaling.maxReplicas

  - it: quotes a ConfigMap key that YAML would read as null
    template: templates/configmap.yaml
    set:
      configMap.enabled: true
      configMap.items.settings.data:
        "null": x
    asserts:
      - equal:
          path: data["null"]
          value: x

  - it: rejects an unknown key in a role
    template: templates/role.yaml
    set:
      serviceAccount.create: true
      rbac.roles:
        - name: configmaps
          rule: []
          rules: []
    asserts:
      - failedTemplate:
          errorPattern: additional properties 'rule' not allowed

  - it: warns about loadBalancerIP only for a LoadBalancer Service
    template: templates/NOTES.txt
    set:
      service.loadBalancerIP: 10.0.0.1
    asserts:
      - notMatchRegexRaw:
          pattern: loadBalancerIP
