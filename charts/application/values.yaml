pdb:
  # -- (bool) Create a PodDisruptionBudget. Not supported for a DaemonSet.
  # @section -- PodDisruptionBudget Parameters
  enabled: false
  # -- (object) Additional labels for the PDB.
  # @section -- PodDisruptionBudget Parameters
  additionalLabels: {}
  # -- (object) Annotations for the PDB.
  # @section -- PodDisruptionBudget Parameters
  annotations: {}
  # -- (int or string) Minimum number of pods that must stay available.
  # When set, it replaces `maxUnavailable`.
  # @section -- PodDisruptionBudget Parameters
  minAvailable:
  # -- (int or string) Maximum number of pods that can be unavailable.
  # Unlike `minAvailable: 1`, this doesn't block node drains for a single replica.
  # @section -- PodDisruptionBudget Parameters
  maxUnavailable: 1
  # -- (string) `IfHealthyBudget` or `AlwaysAllow`: whether unhealthy pods can be evicted.
  # @section -- PodDisruptionBudget Parameters
  unhealthyPodEvictionPolicy: ""

