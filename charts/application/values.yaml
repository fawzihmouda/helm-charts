# Values that take a list or a map (`env`, `volumes`, `volumeMounts`, `initContainers`,
# `additionalContainers`, `extraObjects`) default to null, because Helm warns when a list
# replaces a map default. Optional numbers and rule lists where "unset" differs from
# "empty" also default to null.
# In a map, the key is the entry's name and wins over a `name` inside the entry. A null
# entry is skipped, so a values file can remove an entry that another file adds.

# -- (string) Override the namespace for all resources.
# @section -- Parameters
namespaceOverride: ""

# -- (string) Override the component label for all resources.
# @section -- Parameters
componentOverride: ""

# -- (string) Override the partOf label for all resources.
# @section -- Parameters
partOfOverride: ""

# -- (string) Base name of every resource. Set it when two releases of this chart must not
# share a name, for example two aliases of the chart in one umbrella chart.
# A StatefulSet name must be at most 52 characters.
# @default -- `{{ .Release.Name }}`
# @section -- Parameters
fullnameOverride: ""

# -- (tpl/object) Additional labels for all resources.
# @section -- Parameters
additionalLabels: {}
  # example.com/team: team-name
  # example.com/owner: owner-name

workload:
  # -- (bool) Deploy the long-running workload.
  # @section -- Workload Parameters
  enabled: true
  # -- (string) Workload kind: `Deployment`, `StatefulSet` or `DaemonSet`.
  # A StatefulSet gets one PVC per pod when `persistence.enabled` is true, and a headless
  # Service named `<name>-headless` for per-pod DNS.
  # Changing between Deployment and StatefulSet with persistence removes the PVC of the
  # old kind, and the new kind starts with empty volumes. To keep the data, set
  # `persistence.annotations` to `helm.sh/resource-policy: keep` first.
  # @section -- Workload Parameters
  kind: Deployment
  # -- (object) Additional labels for the workload.
  # @section -- Workload Parameters
  additionalLabels: {}
  # -- (object) Annotations for the workload.
  # @section -- Workload Parameters
  annotations: {}
  # -- (int) Number of replicas. Ignored for a DaemonSet or when autoscaling is enabled.
  # Enabling autoscaling on a running release drops the field, so Kubernetes briefly
  # scales to 1 until the HPA restores minReplicas. Turning autoscaling off with no
  # `replicas` set keeps the last replica count.
  # @section -- Workload Parameters
  replicas:
  # -- (object) Update strategy. Rendered as `strategy` for a Deployment and
  # `updateStrategy` for a StatefulSet or DaemonSet. When `type` is empty, the chart uses
  # RollingUpdate, or Recreate for a Deployment that mounts a ReadWriteOnce(Pod) PVC,
  # because the new pod can't attach the volume while the old pod holds it.
  # A RollingUpdate renders every `rollingUpdate` field, with the Kubernetes default for
  # each field not set here. Helm then owns the fields and can remove them when `type` changes.
  # @section -- Workload Parameters
  strategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxUnavailable: 25%
    #   maxSurge: 25%
  # -- (int) Number of old revisions to keep.
  # @section -- Workload Parameters
  revisionHistoryLimit: 2
  # -- (int) Seconds a new pod must be ready before it counts as available.
  # @section -- Workload Parameters
  minReadySeconds:
  # -- (int) Deployment only: seconds before a stalled rollout is reported as failed.
  # @section -- Workload Parameters
  progressDeadlineSeconds:
  # -- (string) StatefulSet only: `OrderedReady` or `Parallel`. Can't change after install.
  # @section -- Workload Parameters
  podManagementPolicy: ""
  # -- (object) StatefulSet only: what happens to the PVCs when the StatefulSet is deleted
  # or scaled down.
  # @section -- Workload Parameters
  persistentVolumeClaimRetentionPolicy: {}
    # whenDeleted: Retain
    # whenScaled: Delete

  # The values below describe the pod. Each entry of `job.jobs` and `cronJob.jobs` takes
  # the same ones.

  # -- (object) Additional pod labels. Not used in selectors.
  # @section -- Workload Parameters
  podLabels: {}
  # -- (object) Additional pod annotations.
  # @section -- Workload Parameters
  podAnnotations: {}
  image:
    # -- (tpl/string) Image repository. Required.
    # @section -- Workload Parameters
    repository: ""
    # -- (tpl/string) Image tag. Also sets the `app.kubernetes.io/version` label.
    # @section -- Workload Parameters
    tag: ""
    # -- (tpl/string) Image digest, such as `sha256:...`. When set with a tag, the image is
    # pulled by digest.
    # @section -- Workload Parameters
    digest: ""
    # -- (string) Image pull policy.
    # @section -- Workload Parameters
    pullPolicy: IfNotPresent
  # -- (tpl/list) List of secrets used to pull the images.
  # @section -- Workload Parameters
  imagePullSecrets: []
    # - name: registry-credentials
  # -- (tpl/list) Command for the app container.
  # @section -- Workload Parameters
  command: []
  # -- (tpl/list) Args for the app container.
  # @section -- Workload Parameters
  args: []
  # -- (string) Working directory of the app container.
  # @section -- Workload Parameters
  workingDir: ""
  # -- (list) Ports of the app container.
  # @section -- Workload Parameters
  ports: []
    # - containerPort: 8080
    #   name: http
    #   protocol: TCP
  # -- (tpl/list or object) Environment variables for the app container.
  # A `$(VAR)` reference only resolves if VAR comes earlier, so use a list when order matters.
  # A map is keyed by variable name and sorted alphabetically.
  # @section -- Workload Parameters
  env:
    # ENVIRONMENT:
    #   value: dev
    # FREQUENCY:
    #   valueFrom:
    #     configMapKeyRef:
    #       name: config
    #       key: frequency
  # -- (tpl/list) Kubernetes `envFrom` entries for the app container.
  # @section -- Workload Parameters
  envFrom: []
    # - configMapRef:
    #     name: '{{ include "application.fullname" . }}-settings'
    # - secretRef:
    #     name: '{{ include "application.fullname" . }}-db'
    #     optional: true
  # -- (object) Startup probe, as a Kubernetes probe.
  # @section -- Workload Parameters
  startupProbe: {}
    # failureThreshold: 30
    # periodSeconds: 10
    # httpGet:
    #   path: /healthz
    #   port: http
  # -- (object) Readiness probe, as a Kubernetes probe.
  # @section -- Workload Parameters
  readinessProbe: {}
    # httpGet:
    #   path: /readyz
    #   port: http
  # -- (object) Liveness probe, as a Kubernetes probe.
  # @section -- Workload Parameters
  livenessProbe: {}
    # tcpSocket:
    #   port: http
  # -- (object) Lifecycle hooks of the app container.
  # @section -- Workload Parameters
  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 20"]
  # -- (object) Resource requests and limits of the app container.
  # @section -- Workload Parameters
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   memory: 256Mi
  # -- (object) Security context of the containers. The default meets the Pod Security
  # "restricted" profile. Images that must run as root or write outside mounted volumes
  # need this relaxed.
  # A value set here replaces the whole default, it doesn't merge with it. To run as a
  # fixed user, keep the default and set `securityContext.runAsUser`. An image whose user
  # is a name, not a number, needs that.
  # It is also the default for Job and CronJob containers, and for every init container
  # and additional container that sets no `securityContext`.
  # @section -- Workload Parameters
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # -- (object) Security context of the pod.
  # @section -- Workload Parameters
  securityContext: {}
    # fsGroup: 2000
  # -- (bool) Mount an emptyDir at /tmp in the app container, since the default root
  # filesystem is read-only. Skipped when `volumeMounts` already mounts something at /tmp.
  # An init container or additional container that sets no `securityContext` gets the
  # same mount, unless it mounts /tmp itself.
  # @section -- Workload Parameters
  writableTmp: true
  # -- (tpl/list or object) Volumes of the pod. A map is keyed by volume name.
  # @section -- Workload Parameters
  volumes:
    # config:
    #   configMap:
    #     name: '{{ include "application.fullname" . }}-files'
  # -- (tpl/list or object) Volume mounts of the app container.
  # A map is keyed by volume name. Use a list to mount one volume more than once.
  # @section -- Workload Parameters
  volumeMounts:
    # config:
    #   mountPath: /etc/app
    #   readOnly: true
  # -- (tpl/list or object) Init containers. They run in order, so use a list when order
  # matters. A map is keyed by container name and sorted alphabetically.
  # For a native sidecar, add an init container with `restartPolicy: Always`.
  # @section -- Workload Parameters
  initContainers:
    # - name: wait-for-db
    #   image: busybox:1.37
    #   command: ["sh", "-c", "until nc -z db 5432; do sleep 1; done"]
  # -- (tpl/list or object) Containers that run beside the app container.
  # A map is keyed by container name.
  # @section -- Workload Parameters
  additionalContainers:
    # - name: log-shipper
    #   image: busybox:1.37
    #   command: ["sh", "-c", "tail -F /tmp/app.log"]
  # -- (bool) Mount the Service Account token.
  # @section -- Workload Parameters
  automountServiceAccountToken: true
  # -- (bool) Inject the namespace's Services as environment variables.
  # @section -- Workload Parameters
  enableServiceLinks: true
  # -- (int) Seconds a pod gets to stop before it is killed.
  # @section -- Workload Parameters
  terminationGracePeriodSeconds:
  # -- (list) Entries added to the pod's hosts file.
  # @section -- Workload Parameters
  hostAliases: []
    # - ip: "127.0.0.1"
    #   hostnames:
    #     - foo.local
  # -- (bool) Use the node's network namespace. Set `dnsPolicy` to
  # `ClusterFirstWithHostNet` to keep resolving cluster Service names.
  # @section -- Workload Parameters
  hostNetwork: false
  # -- (bool) Use the node's process ID namespace.
  # @section -- Workload Parameters
  hostPID: false
  # -- (bool) Share one process namespace between the pod's containers.
  # @section -- Workload Parameters
  shareProcessNamespace: false
  # -- (string) DNS policy of the pod.
  # @section -- Workload Parameters
  dnsPolicy: ""
  # -- (object) DNS config of the pod.
  # @section -- Workload Parameters
  dnsConfig: {}
    # options:
    #   - name: ndots
    #     value: "1"
  # -- (object) Node labels the pod needs.
  # @section -- Workload Parameters
  nodeSelector: {}
  # -- (string) Priority class of the pod.
  # @section -- Workload Parameters
  priorityClassName: ""
  # -- (string) Runtime class of the pod.
  # @section -- Workload Parameters
  runtimeClassName: ""
  # -- (list) Taints the pod tolerates.
  # @section -- Workload Parameters
  tolerations: []
    # - key: dedicated
    #   operator: Equal
    #   value: app
    #   effect: NoSchedule
  # -- (object) Affinity rules of the pod.
  # @section -- Workload Parameters
  affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: disktype
    #             operator: In
    #             values:
    #               - ssd
  # -- (list) Topology spread constraints of the pod.
  # @section -- Workload Parameters
  topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: ScheduleAnyway
    #   labelSelector:
    #     matchLabels:
    #       app.kubernetes.io/instance: my-release

job:
  # -- (bool) Deploy Job resources.
  # @section -- Job Parameters
  enabled: false
  # -- (object) Map of Jobs. The key is the name suffix, the value is the Job.
  # Each Job takes the pod values of `workload` (`image` is required), plus `additionalLabels`,
  # `annotations`, `restartPolicy` (default `OnFailure`, or `Never` with a `podFailurePolicy`)
  # and the Job fields in the example.
  # The Job name ends in a hash of its spec. A Job's pod template can't change, so a change
  # creates a new Job that runs again, and Helm deletes the old one. The pod template
  # includes the chart-wide values `additionalLabels`, `partOfOverride`, `componentOverride`,
  # `serviceAccount` and `workload.containerSecurityContext`, so a change to one of them
  # runs every Job again.
  # A Job with `suspend: true` never completes, so `helm install --wait` times out.
  # Use `ttlSecondsAfterFinished` only on Helm hook Jobs: Helm recreates a missing Job,
  # so a Job deleted by its TTL runs again on the next upgrade.
  # Job pods get `app.kubernetes.io/name: <job name>`, so the Service never selects them.
  # @section -- Job Parameters
  jobs: {}
    # A hook Job keeps a fixed name so the delete policy can replace it. A pre-install hook
    # runs before the chart's other resources exist, including its Service Account, so
    # use post-install for the first run.
    # db-migration:
    #   annotations:
    #     helm.sh/hook: "post-install,pre-upgrade"
    #     helm.sh/hook-weight: "-1"
    #     helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
    #   image:
    #     repository: ghcr.io/example/migrate
    #     tag: "1.0.0"
    #   command: ["migrate", "up"]
    #   env:
    #     DATABASE_HOST:
    #       value: db
    #   resources:
    #     requests:
    #       cpu: 100m
    #       memory: 128Mi
    #   suspend: false
    #   activeDeadlineSeconds: 600
    #   backoffLimit: 2
    #   ttlSecondsAfterFinished: 3600
    #   parallelism: 1
    #   completions: 1
    #   completionMode: NonIndexed
    #   podFailurePolicy:
    #     rules:
    #       - action: FailJob
    #         onExitCodes:
    #           operator: In
    #           values: [42]

cronJob:
  # -- (bool) Deploy CronJob resources.
  # @section -- CronJob Parameters
  enabled: false
  # -- (object) Map of CronJobs. The key is the name suffix, the value is the CronJob.
  # Each CronJob takes everything a `job.jobs` entry takes, plus the CronJob fields in the
  # example. `schedule` is required.
  # @section -- CronJob Parameters
  jobs: {}
    # cleanup:
    #   schedule: "0 3 * * *"
    #   timeZone: Australia/Sydney
    #   suspend: false
    #   concurrencyPolicy: Forbid
    #   startingDeadlineSeconds: 60
    #   successfulJobsHistoryLimit: 3
    #   failedJobsHistoryLimit: 1
    #   image:
    #     repository: ghcr.io/example/cleanup
    #     tag: "1.0.0"
    #   command: ["cleanup", "--older-than", "30d"]

persistence:
  # -- (bool) Create a PVC, or one PVC per pod for a StatefulSet.
  # A StatefulSet's PVCs are named `data-<pod name>`, and its claim templates can't change
  # after install. Turning persistence on or off, or changing storageSize, storageClass,
  # accessMode, volumeMode, volumeName, existingClaim, additionalLabels or annotations,
  # needs `kubectl delete sts <name> --cascade=orphan` before the upgrade.
  # Resize existing claims by editing the PVCs directly.
  # @section -- Persistence Parameters
  enabled: false
  # -- (bool) Mount the volume in the app container.
  # @section -- Persistence Parameters
  mountPVC: false
  # -- (string) Where `mountPVC` mounts the volume.
  # @section -- Persistence Parameters
  mountPath: /data
  # -- (string) Name of the PVC the chart creates. Not used for a StatefulSet.
  # @default -- `{{ include "application.fullname" $ }}-data`
  # @section -- Persistence Parameters
  name: ""
  # -- (string) Use this existing PVC instead of creating one.
  # @section -- Persistence Parameters
  existingClaim: ""
  # -- (string) Access mode of the volume. A DaemonSet needs `ReadWriteMany`.
  # @section -- Persistence Parameters
  accessMode: ReadWriteOnce
  # -- (string) Storage class of the volume.
  # If null (the default), use the cluster's default storage class.
  # If set to "-" or "", disable dynamic provisioning.
  # @section -- Persistence Parameters
  storageClass:
  # -- (object) Additional labels for the PVC.
  # @section -- Persistence Parameters
  additionalLabels: {}
  # -- (object) Annotations for the PVC.
  # @section -- Persistence Parameters
  annotations: {}
    # helm.sh/resource-policy: keep
  # -- (string) Size of the volume.
  # @section -- Persistence Parameters
  storageSize: 8Gi
  # -- (string) Volume mode: `Filesystem` or `Block`.
  # @section -- Persistence Parameters
  volumeMode: ""
  # -- (string) Bind the PVC to this PersistentVolume.
  # @section -- Persistence Parameters
  volumeName: ""

service:
  # -- (bool) Create a Service for the workload.
  # @section -- Service Parameters
  enabled: true
  # -- (object) Additional labels for the Service.
  # @section -- Service Parameters
  additionalLabels: {}
  # -- (tpl/object) Annotations for the Service.
  # @section -- Service Parameters
  annotations: {}
  # -- (list) Ports of the Service.
  # @section -- Service Parameters
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080
  # -- (string) Type of Service: `ClusterIP`, `NodePort` or `LoadBalancer`.
  # @section -- Service Parameters
  type: ClusterIP
  # -- (string) Fixed IP for the Service, or `None` for a headless Service.
  # Can't change after install.
  # @section -- Service Parameters
  clusterIP: ""
  # -- (list) External IPs routed to the Service.
  # @section -- Service Parameters
  externalIPs: []
  # -- (string) `Cluster` or `Local`, for NodePort and LoadBalancer Services.
  # @section -- Service Parameters
  externalTrafficPolicy: ""
  # -- (string) `Cluster` or `Local`, for traffic from inside the cluster.
  # @section -- Service Parameters
  internalTrafficPolicy: ""
  # -- (list) IP families of the Service, such as `IPv4` and `IPv6`.
  # @section -- Service Parameters
  ipFamilies: []
  # -- (string) `SingleStack`, `PreferDualStack` or `RequireDualStack`.
  # @section -- Service Parameters
  ipFamilyPolicy: ""
  # -- (bool) Publish pod addresses before the pods are ready.
  # @section -- Service Parameters
  publishNotReadyAddresses: false
  # -- (string) `None` or `ClientIP`.
  # @section -- Service Parameters
  sessionAffinity: ""
  # -- (object) Session affinity settings.
  # @section -- Service Parameters
  sessionAffinityConfig: {}
    # clientIP:
    #   timeoutSeconds: 10800
  # -- (string) Load balancer class, for LoadBalancer Services.
  # @section -- Service Parameters
  loadBalancerClass: ""
  # -- (string) Deprecated in Kubernetes. Requested IP, for LoadBalancer Services.
  # @section -- Service Parameters
  loadBalancerIP: ""
  # -- (list) Allowed client CIDRs, for LoadBalancer Services.
  # @section -- Service Parameters
  loadBalancerSourceRanges: []

httpRoute:
  # -- (bool) Create an HTTPRoute (Gateway API).
  # @section -- HTTPRoute Parameters
  enabled: false
  # -- (tpl/list) Gateways the route attaches to. Required unless `useDefaultGateways` is set.
  # @section -- HTTPRoute Parameters
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-infra
    #   sectionName: http
  # -- (string) Attach the route to the default Gateways: `All` or `None`.
  # Needs the experimental channel of Gateway API.
  # @section -- HTTPRoute Parameters
  useDefaultGateways: ""
  # -- (tpl/list) Hostnames of the route.
  # @section -- HTTPRoute Parameters
  hostnames: []
  # -- (object) Additional labels for the HTTPRoute.
  # @section -- HTTPRoute Parameters
  additionalLabels: {}
  # -- (object) Annotations for the HTTPRoute.
  # @section -- HTTPRoute Parameters
  annotations: {}
  # -- (tpl/list) Rules of the route.
  # When empty, all paths go to the first Service port.
  # Ports must be numbers: a templated port renders as a quoted string, which the API rejects.
  # @section -- HTTPRoute Parameters
  rules: []
    # - matches:
    #     - path:
    #         type: PathPrefix
    #         value: /api
    #   backendRefs:
    #     - name: '{{ include "application.fullname" $ }}'
    #       port: 8080

serviceAccount:
  # -- (bool) Create a Service Account. All pods and role bindings use it.
  # When false, pods use `name` if set (an existing account) or the namespace's `default` account.
  # @section -- RBAC Parameters
  create: false
  # -- (string) Service Account name.
  # @default -- `{{ include "application.fullname" $ }}` when created, otherwise `default`
  # @section -- RBAC Parameters
  name: ""
  # -- (object) Additional labels for the Service Account.
  # @section -- RBAC Parameters
  additionalLabels: {}
  # -- (object) Annotations for the Service Account.
  # @section -- RBAC Parameters
  annotations: {}

rbac:
  # -- (bool) Create the roles in `roles` and `clusterRoles`, and their bindings.
  # @section -- RBAC Parameters
  create: true
  # -- (object) Additional labels for the roles and bindings.
  # @section -- RBAC Parameters
  additionalLabels: {}
  # -- (object) Annotations for the roles and bindings.
  # @section -- RBAC Parameters
  annotations: {}
  # -- (list) Namespaced Roles, each bound to the pods' Service Account.
  # Needs `serviceAccount.create` or `serviceAccount.name`, so the roles never go to the
  # `default` account.
  # @section -- RBAC Parameters
  roles: []
    # - name: configmaps
    #   rules:
    #     - apiGroups: [""]
    #       resources: [configmaps]
    #       verbs: [get]
  # -- (list) ClusterRoles, each bound to the pods' Service Account with a ClusterRoleBinding.
  # Takes the same entries as `roles`.
  # @section -- RBAC Parameters
  clusterRoles: []
    # - name: nodes
    #   rules:
    #     - apiGroups: [""]
    #       resources: [nodes]
    #       verbs: [get, list]

configMap:
  # -- (bool) Deploy the ConfigMaps in `items`.
  # @section -- ConfigMap Parameters
  enabled: false
  # -- (object) Additional labels for the ConfigMaps.
  # @section -- ConfigMap Parameters
  additionalLabels: {}
  # -- (object) Annotations for the ConfigMaps.
  # @section -- ConfigMap Parameters
  annotations: {}
  # -- (object) Map of ConfigMaps. The key is the name suffix.
  # `data` values go through tpl, so escape a literal `{{ }}` meant for another tool as
  # '{{`{{ .Status }}`}}'. `binaryData` values are base64 strings.
  # A change to a ConfigMap or Secret of the chart restarts the workload pods.
  # An `immutable` ConfigMap or Secret can't change: an upgrade that changes its content
  # fails, so add a new key to `items` instead.
  # @section -- ConfigMap Parameters
  items: {}
    # settings:
    #   data:
    #     LOG_FORMAT: json
    #     MAX_BYTES: 10485760
    # files:
    #   immutable: false
    #   data:
    #     app.conf: |
    #       name = {{ include "application.fullname" . }}
    #   binaryData:
    #     logo.png: iVBORw0KGgo=

secret:
  # -- (bool) Deploy the Secrets in `items`.
  # @section -- Secret Parameters
  enabled: false
  # -- (object) Additional labels for the Secrets.
  # @section -- Secret Parameters
  additionalLabels: {}
  # -- (object) Annotations for the Secrets.
  # @section -- Secret Parameters
  annotations: {}
  # -- (object) Map of Secrets. The key is the name suffix.
  # There are three ways to give the content:
  # `data` (the chart base64-encodes it), `encodedData` (already base64) and `stringData`
  # (plain text, encoded by Kubernetes).
  # `type` sets the Secret type, for example `kubernetes.io/dockerconfigjson`.
  # @section -- Secret Parameters
  items: {}
    # credentials:
    #   data:
    #     username: admin
    #     password: change-me
    # api-key:
    #   immutable: true
    #   stringData:
    #     key: change-me
    # encoded:
    #   encodedData:
    #     token: dGVzdFZhbHVl

autoscaling:
  # -- (bool) Create a HorizontalPodAutoscaler. Not supported for a DaemonSet.
  # @section -- Autoscaling Parameters
  enabled: false
  # -- (object) Additional labels for the HPA.
  # @section -- Autoscaling Parameters
  additionalLabels: {}
  # -- (object) Annotations for the HPA.
  # @section -- Autoscaling Parameters
  annotations: {}
  # -- (int) Minimum number of replicas.
  # @section -- Autoscaling Parameters
  minReplicas: 1
  # -- (int) Maximum number of replicas.
  # @section -- Autoscaling Parameters
  maxReplicas: 10
  # -- (list) Metrics used for autoscaling.
  # Utilization targets need `workload.resources.requests` for that resource.
  # @section -- Autoscaling Parameters
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  # -- (object) Scaling behaviour.
  # @section -- Autoscaling Parameters
  behavior: {}
    # scaleDown:
    #   stabilizationWindowSeconds: 300

networkPolicy:
  # -- (bool) Create a NetworkPolicy for the workload, Job and CronJob pods.
  # It selects the pods by release and name, so `podLabels` can't take a pod out of it.
  # Needs `ingress` or `egress` to be set.
  # @section -- NetworkPolicy Parameters
  enabled: false
  # -- (object) Additional labels for the NetworkPolicy.
  # @section -- NetworkPolicy Parameters
  additionalLabels: {}
  # -- (object) Annotations for the NetworkPolicy.
  # @section -- NetworkPolicy Parameters
  annotations: {}
  # -- (list) Ingress rules. Null leaves ingress open. An empty list denies all ingress.
  # @section -- NetworkPolicy Parameters
  ingress:
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: gateway-infra
    #   ports:
    #     - protocol: TCP
    #       port: 8080
  # -- (list) Egress rules. Null leaves egress open. An empty list denies all egress,
