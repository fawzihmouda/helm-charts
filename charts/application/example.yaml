# Test values for deploying a hello-world demo to GKE.
#
# The demo uses hashicorp/http-echo (public image) and prints a message
# sourced from GCP Secret Manager. Flow:
#   GCP Secret Manager -> ExternalSecret -> Kubernetes Secret -> pod env -> -text flag
#
# Prerequisites already provisioned:
#   - ClusterSecretStore "gcp-secret-store"
#   - Gateway "shared-external" in namespace "gateway-infra"
#   - GCP Secret Manager secret named "test" (update below if different)
#
# Install:
#   helm install hello-world . -f example.yaml \
#     --namespace hello-world --create-namespace
#
# Change the displayed text by updating the GCP Secret Manager value. ESO refreshes
# the Kubernetes Secret. Restart the pod to load the new value.

fullnameOverride: hello-world

additionalLabels:
  app: '{{ include "application.fullname" . }}'
  env: test

workload:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  image:
    repository: hashicorp/http-echo
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  # http-echo requires -text. $(MESSAGE) expands from the env block below.
  args:
  - "-listen=:5678"
  - "-text=$(MESSAGE)"

  env:
    MESSAGE:
      valueFrom:
        secretKeyRef:
          name: '{{ include "application.fullname" . }}-message'
          key: message

  ports:
  - containerPort: 5678
    name: http
    protocol: TCP

  startupProbe:
    failureThreshold: 10
    periodSeconds: 3
    successThreshold: 1
    timeoutSeconds: 1
    initialDelaySeconds: 2
    httpGet:
      path: /
      port: 5678

  readinessProbe:
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
    initialDelaySeconds: 3
    httpGet:
      path: /
      port: 5678

  livenessProbe:
    failureThreshold: 3
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 1
    initialDelaySeconds: 10
    httpGet:
      path: /
      port: 5678

  resources:
    limits:
      memory: 64Mi
      cpu: 100m
    requests:
      memory: 32Mi
      cpu: 10m

  securityContext:
    runAsUser: 65534

  terminationGracePeriodSeconds: 30
  automountServiceAccountToken: false

service:
  enabled: true
  type: ClusterIP
  ports:
  - port: 80
    name: http
    protocol: TCP
    targetPort: 5678

httpRoute:
  enabled: true
  parentRefs:
  - name: shared-external
    namespace: gateway-infra
  hostnames:
  - test.fawzi.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: '{{ include "application.fullname" . }}'
      port: 80

serviceAccount:
  create: true

extraObjects:
  # Read by workload.env.MESSAGE.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: '{{ include "application.fullname" . }}-message'
    spec:
      refreshInterval: 1m
      secretStoreRef:
        name: gcp-secret-store
        kind: ClusterSecretStore
      target:
        name: '{{ include "application.fullname" . }}-message'
      data:
        # Key in the resulting Kubernetes Secret.
        - secretKey: message
          remoteRef:
            # Name of the secret in GCP Secret Manager.
            key: test
